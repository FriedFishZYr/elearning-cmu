<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An offline pilot study with a pre-test, a learning module, and a post-test on working with AI-written Python code.">
  <meta name="color-scheme" content="light">
  <title>Programming with AI · Pilot study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%239d2434'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='monospace' font-size='35' fill='white'%3E%26lt;%26gt;%3C/text%3E%3C/svg%3E">
  <style>/* Shared pilot questionnaire and learning-module presentation. */
:root {
  --ink: #202936;
  --muted: #536172;
  --paper: #fff;
  --canvas: #f3f5f7;
  --line: #dce1e6;
  --red: #9d2434;
  --red-dark: #86202e;
  --red-light: #f9f0f2;
  --code: #17212e;
  --green: #166448;
  --green-light: #eef8f2;
  --amber: #845019;
  --amber-light: #fff6e8;
  /* Compact text scale with a 16px floor; larger browser preferences still apply. */
  --text-body: 1rem;
  --text-support: 1rem;
  --text-small: 1rem;
  --text-meta: 1rem;
  --text-question: 1.125rem;
  --text-title: 1.75rem;
  --text-title-mobile: 1.5rem;
  color-scheme: light;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: var(--canvas);
  font-size: max(100%, 16px);
  line-height: 1.65;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea, summary { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
a { color: var(--red); text-underline-offset: 3px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, summary:focus-visible, pre:focus-visible {
  outline: 3px solid #2767b0;
  outline-offset: 3px;
}
h1, h2, h3, h4, p { margin-top: 0; }
h1 {
  font-family: inherit;
  font-size: var(--text-title);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -.01em;
  color: var(--code);
  margin-bottom: 12px;
}
h2, h3 { font-size: var(--text-question); font-weight: 550; line-height: 1.55; margin-bottom: 12px; }
h4 { font-size: var(--text-support); font-weight: 600; margin-bottom: 6px; }
p { margin-bottom: 16px; }
small { font-size: var(--text-small); }
code {
  font-family: Consolas, "Cascadia Code", "SFMono-Regular", "Liberation Mono", monospace;
  font-size: max(1rem, .92em);
}
p code, li code { background: #eef1f4; padding: 1px 3px; border-radius: 2px; overflow-wrap: anywhere; }
svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.skip-link { position: fixed; left: 16px; top: -80px; padding: 12px; background: var(--paper); z-index: 10; clip-path: inset(50%); }
.skip-link:focus { top: 12px; clip-path: none; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Masthead, study stages, and the shared questionnaire sheet. */
.topbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 20px;
  padding: 20px 30px 18px;
  border-top: 4px solid var(--red);
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}
.brand { font-size: var(--text-question); font-weight: 500; letter-spacing: -.015em; }
.brand strong { font-weight: 500; }
.top-meta { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: var(--text-small); }
.study-stages ol {
  display: grid;
  grid-template-columns: 1fr 1.45fr 1fr;
  max-width: 620px;
  margin: 0 auto;
  padding: 0 12px;
  list-style: none;
}
.study-stages li {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 0;
  padding: 19px 3px 15px;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-size: var(--text-small);
}
.study-stages li[aria-current="step"] { color: var(--red); border-bottom-color: var(--red); font-weight: 500; }
.study-stage-label { text-align: center; line-height: 1.45; }
.study-stage-number { font-variant-numeric: tabular-nums; }
.layout { display: block; width: calc(100% - 48px); max-width: 55.125rem; margin: 28px auto 34px; }
.main { min-width: 0; max-width: 54rem; margin: 0 auto; padding: 32px 40px; border: 1px solid var(--line); background: var(--paper); }
.progress-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; color: var(--red); font-size: var(--text-small); font-weight: 500; }
.progress-line progress { appearance: none; border: 0; width: 100px; max-width: 25%; height: 3px; background: var(--line); }
.progress-line progress::-webkit-progress-bar { background: var(--line); }
.progress-line progress::-webkit-progress-value { background: var(--red); }
.progress-line progress::-moz-progress-bar { background: var(--red); }
.progress-value { color: var(--muted); font-weight: 400; }
.activity-header { margin-bottom: 24px; }
.eyebrow { margin-bottom: 10px; color: var(--red); font-size: var(--text-small); font-weight: 500; }
.lead { color: var(--muted); font-size: var(--text-body); margin-bottom: 0; }
.footer { display: flex; justify-content: center; flex-wrap: wrap; gap: 3px 20px; max-width: 54rem; margin: 15px auto 0; color: var(--muted); font-size: var(--text-meta); text-align: center; }
.storage-warning { margin: 0 0 20px; padding: 12px 14px; border-left: 2px solid var(--amber); background: var(--amber-light); color: var(--amber); font-size: var(--text-support); }
.noscript { max-width: 650px; padding: 40px 24px; margin: auto; }

/* Native section disclosure keeps module navigation available without a rail. */
.sidebar { max-width: 54rem; margin: 0 auto 12px; }
.section-menu { font-size: var(--text-small); }
.section-menu > summary { min-height: 44px; padding: 10px 4px; color: var(--muted); cursor: pointer; }
.section-menu > summary::marker { color: var(--muted); }
.section-current { margin-left: 14px; color: var(--ink); }
.stage-list { list-style: none; padding: 4px 0 10px; margin: 0; border-top: 1px solid var(--line); }
.stage-list li { min-width: 0; }
.stage-button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-left: 2px solid transparent; background: transparent; color: var(--muted); text-align: left; font-size: var(--text-support); }
.stage-button:hover:not(:disabled) { background: #e9edf1; color: var(--ink); }
.stage-button.current { color: var(--red); border-left-color: var(--red); background: var(--red-light); font-weight: 500; }
.stage-button:disabled { color: var(--muted); opacity: .7; }
.stage-number { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 22px; font-size: var(--text-meta); font-variant-numeric: tabular-nums; }
.stage-number svg { width: 15px; height: 15px; }
.done .stage-number { color: var(--green); }
.stage-name { min-width: 0; }

/* Reading material and code remain stacked above each question. */
.activity-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
.activity-grid.single-column { display: block; }
.evidence { min-width: 0; position: static; }
.spec { margin: 0 0 18px; padding-left: 15px; border-left: 2px solid var(--line); }
.spec .label { margin-bottom: 6px; color: var(--muted); font-size: var(--text-meta); font-weight: 500; }
.spec p { margin: 0; }
.code-card { margin-bottom: 22px; overflow: hidden; border: 1px solid var(--code); border-radius: 3px; background: var(--code); color: #e7edf5; }
.code-card:last-child { margin-bottom: 0; }
.code-label { display: flex; justify-content: space-between; gap: 14px; padding: 13px 18px 0; color: #b8c5d4; font-size: var(--text-meta); }
.code-label .language { font-size: var(--text-meta); }
.code-card pre { margin: 0; padding: 14px 0 18px; overflow-x: auto; tab-size: 4; line-height: 1.75; font-size: var(--text-small); }
.code-card code { font-size: inherit; white-space: pre; }
.code-line { position: relative; display: inline-block; min-width: 100%; padding: 0 18px 0 43px; vertical-align: top; }
.code-line-number { position: absolute; left: 0; width: 28px; color: #a7b7c9; text-align: right; user-select: none; }
.code-line-number::before { content: attr(data-line); }
.code-line.focus-line { background: #2c3c4d; box-shadow: inset 3px 0 #a4c7e5; }
.token-keyword { color: #d4aff7; }
.token-string { color: #b5dfbd; }
.token-number { color: #f2cb8c; }
.token-comment { color: #a7b7c9; }
.reminder { margin-top: 12px; color: var(--muted); font-size: var(--text-support); }
.reminder summary { min-height: 44px; padding: 10px 0; cursor: pointer; font-weight: 500; }
.reminder p { margin: 4px 0 0; }
.review-steps { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 16px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: var(--text-small); }
.review-steps li { display: flex; align-items: center; gap: 6px; }
.review-steps li > span { font-variant-numeric: tabular-nums; }
.review-steps .current { color: var(--red); font-weight: 600; }
.review-steps .done { color: var(--ink); }

/* Answer rows: native controls, restrained selection, explicit result labels. */
.answer-panel { min-width: 0; padding: 0; border: 0; }
.question-kind { color: var(--muted); font-size: var(--text-small); margin-bottom: 10px; }
.question-title { font-size: var(--text-question); font-weight: 550; line-height: 1.55; margin-bottom: 14px; overflow-wrap: anywhere; }
.instruction { font-size: var(--text-support); color: var(--muted); margin-bottom: 18px; }
.choices { min-width: 0; padding: 0; margin: 0; border: 0; border-top: 1px solid var(--line); }
.choice { display: flex; align-items: flex-start; gap: 12px; min-height: 50px; padding: 17px 10px; margin: 0; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: var(--text-body); line-height: 1.65; overflow-wrap: anywhere; }
.choice:hover { background: #f7f8fa; }
.choice.selected:not(.good):not(.missed), .choice:has(input:checked):not(.good):not(.missed) { background: var(--red-light); }
.choice input { appearance: auto; flex: 0 0 19px; width: 19px; height: 19px; margin: 5px 0 0; accent-color: var(--red); }
.choice.good { background: var(--green-light); }
.choice.missed { background: var(--amber-light); }
.choice.good input { accent-color: var(--green); }
.choice.missed input { accent-color: var(--amber); }
.choices:disabled .choice { cursor: default; }
.choices:disabled .choice:not(.selected):not(.good):not(.missed):hover { background: transparent; }
.choice-body { flex: 1; min-width: 0; }
.choice-status { display: block; margin-top: 6px; color: var(--green); font-size: var(--text-small); font-weight: 600; }
.choice.missed .choice-status { color: var(--amber); }
.action-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; }
.action-row .primary { margin-left: auto; }
.btn { display: inline-flex; max-width: 100%; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 22px; border: 1px solid transparent; border-radius: 3px; font-size: var(--text-support); font-weight: 500; line-height: 1.5; text-decoration: none; }
.btn.primary { background: var(--red); border-color: var(--red); color: white; }
.btn.primary:hover:not(:disabled) { background: var(--red-dark); border-color: var(--red-dark); }
.btn.secondary { background: white; color: var(--ink); border-color: #abb5bf; }
.btn.secondary:hover:not(:disabled) { background: #f3f5f7; }
.btn.quiet { background: transparent; color: var(--muted); padding-left: 0; padding-right: 0; }
.btn.quiet:hover:not(:disabled) { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .5; }
.error { margin: 12px 0 0; color: var(--red); font-size: var(--text-support); }

/* Explanations follow the answer in the same reading column. */
.feedback { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); scroll-margin-top: 20px; }
.feedback:focus, .main h1:focus { outline: none; }
.feedback-label { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--green); font-size: var(--text-support); font-weight: 600; }
.feedback-label.revisit { color: var(--amber); }
.feedback h3 { margin-bottom: 10px; }
.feedback p { color: #3d4c5e; }
.feedback .selected-explanation { padding-left: 14px; border-left: 2px solid var(--line); }
.feedback-comparison { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin: 16px 0; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.feedback-comparison span { display: block; margin-bottom: 4px; color: var(--muted); font-size: var(--text-small); }
.feedback-comparison code { font-size: var(--text-support); white-space: pre-wrap; overflow-wrap: anywhere; }
.feedback .line-reference { padding-left: 14px; border-left: 2px solid #668caa; }
.extra-feedback { margin: 16px 0; color: var(--muted); font-size: var(--text-support); }
.extra-feedback summary { min-height: 44px; padding: 10px 0; color: var(--ink); cursor: pointer; font-weight: 500; }
.extra-feedback ul { padding-left: 20px; }
.extra-feedback li { margin: 12px 0; }
.extra-feedback li strong { display: block; color: var(--ink); font-weight: 550; }
.worked-steps { list-style: none; padding: 0; margin: 20px 0; }
.worked-steps li { padding: 0 0 18px 15px; border-left: 2px solid var(--line); font-size: var(--text-support); }
.worked-steps strong { display: block; margin-bottom: 5px; color: var(--ink); font-weight: 550; }
.recorded { margin: 20px 0; padding: 16px 0 0; border-top: 1px solid var(--line); }
.recorded .caption { margin-bottom: 14px; color: var(--muted); font-size: var(--text-small); }
.test-row { padding: 12px 0; border-top: 1px solid var(--line); font-size: var(--text-support); }
.test-row:last-child { padding-bottom: 0; }
.test-row code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--text-small); }
.test-result { display: block; margin-top: 6px; color: var(--green); font-weight: 550; }
.test-result.fail { color: var(--amber); }
.assembled { margin: 18px 0; padding-left: 15px; border-left: 2px solid var(--red); font-size: var(--text-support); line-height: 1.8; }

/* Sorting uses the same ruled rows as multiple-choice questions. */
.sort-list { margin-top: 20px; border-top: 1px solid var(--line); }
.sort-row { display: grid; grid-template-columns: minmax(0, 1fr) 15.75rem; gap: 14px; align-items: center; padding: 17px 10px; border-bottom: 1px solid var(--line); }
.sort-row label { min-width: 0; font-size: var(--text-body); }
.sort-row label code, .assembled code {
  color: var(--code);
  background: #eef1f4;
  padding: 2px 4px;
  border-radius: 3px;
  font-size: 1em;
  font-weight: 500;
  overflow-wrap: anywhere;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.fragment-number { margin-right: 7px; color: var(--muted); font-size: var(--text-meta); font-variant-numeric: tabular-nums; }
.sort-row select { width: 100%; min-height: 44px; padding: 9px; border: 1px solid #929eaa; border-radius: 3px; background: var(--paper); color: var(--ink); font-size: var(--text-support); }
.sort-row select:disabled { color: var(--ink); background: #f3f5f7; opacity: 1; }
.sort-result { grid-column: 1 / -1; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--text-support); }
.sort-result strong { display: block; color: var(--green); font-weight: 550; }
.sort-row.missed .sort-result strong { color: var(--amber); }
.sort-row.good { background: var(--green-light); }
.sort-row.missed { background: var(--amber-light); }

/* Introductory and closing content share flat, ruled lists. */
.intro-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 18px; color: var(--muted); font-size: var(--text-small); }
.intro-content { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; margin-top: 26px; }
.rules { padding: 0; border-top: 1px solid var(--line); }
.rule { display: flex; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.rule-index { padding-top: 2px; color: var(--red); font-size: var(--text-small); font-variant-numeric: tabular-nums; }
.rule h2 { margin: 0 0 5px; }
.rule p { margin: 0; color: var(--muted); font-size: var(--text-support); }
.intro-aside h2 { margin-bottom: 12px; }
.intro-aside ul { margin: 0 0 20px; padding-left: 20px; color: var(--muted); font-size: var(--text-support); }
.intro-aside li { margin-bottom: 8px; padding-left: 3px; }
.intro-note { margin-bottom: 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--text-support); }
.intro-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 20px; margin-top: 26px; }
.intro-actions small { color: var(--muted); }
.study-overview { padding: 0; margin: 24px 0; border-top: 1px solid var(--line); list-style: none; }
.study-overview li { display: flex; justify-content: space-between; gap: 16px; padding: 17px 0; border-bottom: 1px solid var(--line); }
.study-overview strong { font-weight: 550; }
.study-overview span { color: var(--muted); font-size: var(--text-support); }
.closing-lessons { margin: 26px 0; }
.closing-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; margin: 26px 0; }
.score-card { padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.score-value { margin-bottom: 8px; color: var(--red); font-size: var(--text-title); line-height: 1.2; font-weight: 500; }
.score-value span { color: var(--muted); font-size: var(--text-question); font-weight: 400; }
.score-card p { margin: 0; color: var(--muted); font-size: var(--text-support); }
.closing-rules { margin: 0; padding-left: 20px; color: var(--muted); font-size: var(--text-support); }
.closing-rules li { margin-bottom: 12px; }
.closing-rules strong { color: var(--ink); }
.review-list { padding: 0; margin: 18px 0; list-style: none; border-bottom: 1px solid var(--line); }
.review-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 17px 6px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; font-size: var(--text-body); }
.review-item:hover { background: #f7f8fa; }
.review-icon { display: grid; place-items: center; flex: 0 0 22px; width: 22px; height: 22px; color: var(--green); }
.review-icon.revisit { color: var(--amber); }
.review-item .review-text { flex: 1; min-width: 0; }
.review-item small { display: block; color: var(--muted); font-size: var(--text-small); }
.review-item .arrow { color: var(--muted); }
.score-summary { margin: 20px 0 0; color: var(--muted); font-size: var(--text-support); }
.score-summary strong { color: var(--ink); font-weight: 550; }
.download-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 22px 0 12px; }
.session-tools { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
.session-tools p { color: var(--muted); font-size: var(--text-support); margin-bottom: 12px; }
.new-session { min-height: 44px; padding: 10px 0; border: 0; background: transparent; color: var(--muted); font-size: var(--text-support); text-decoration: underline; text-underline-offset: 4px; }

/* Assessment instructions, response review, and final results. */
.assessment-instructions { margin-top: 14px; color: var(--muted); font-size: var(--text-support); }
.assessment-instructions summary { min-height: 44px; padding: 10px 0; cursor: pointer; font-weight: 500; }
.assessment-instructions p { margin: 4px 0 0; }
.assessment textarea { display: block; width: 100%; min-height: 130px; margin: 10px 0; padding: 12px; border: 1px solid #929eaa; border-radius: 3px; background: var(--paper); color: var(--ink); resize: vertical; }
.assessment-note { margin: 20px 0 0; color: var(--muted); font-size: var(--text-small); }
.assessment-note:first-child { margin: 0 0 20px; }
.assessment-context { white-space: pre-line; }
.assessment-review { padding: 0; margin: 24px 0; border-top: 1px solid var(--line); list-style: none; }
.assessment-review li { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 17px 0; border-bottom: 1px solid var(--line); }
.assessment-review li > div { min-width: 0; }
.assessment-review strong { font-weight: 550; }
.assessment-review p { margin: 6px 0 0; overflow-wrap: anywhere; }
.assessment-review .btn { flex-shrink: 0; min-width: 44px; }
.study-scores { margin: 26px 0; border-top: 1px solid var(--line); }
.study-scores > div { padding: 17px 0; border-bottom: 1px solid var(--line); }
.study-scores dt { margin-bottom: 4px; font-weight: 550; }
.study-scores dd { margin: 0; color: var(--muted); font-size: var(--text-support); }
.test-feedback { margin: 26px 0; }
.assessment-feedback { border-top: 1px solid var(--line); }
.assessment-feedback:last-child { border-bottom: 1px solid var(--line); }
.assessment-feedback summary { min-height: 44px; padding: 17px 0; cursor: pointer; font-size: var(--text-support); font-weight: 500; }
.assessment-feedback > div { padding: 8px 0 18px; overflow-wrap: anywhere; }

@media (max-width: 760px) {
  .sort-row { grid-template-columns: minmax(0, 1fr); gap: 12px; }
}

@media (max-width: 600px) {
  .topbar { padding: 16px 19px 15px; }
  .study-stages ol { padding: 0 8px; }
  .study-stages li { gap: 5px; }
  .layout { width: calc(100% - 24px); margin: 18px auto 24px; }
  .main { padding: 25px 21px 23px; }
  h1 { font-size: var(--text-title-mobile); }

const StudyState = (() => {

    if (phase === 'post' && (!study.tests.pre.submittedAt || !moduleComplete(study, content))) return false;
    if (phase === 'complete' && (!study.tests.post.submittedAt || !moduleComplete(study, content))) return false;

      if (fresh.phase === 'pre' && (pre.submittedAt || !moduleUntouched(fresh) || !testUntouched(post))) return null;

    const progressText = inPractice
      ? (state.position===0 ? 'Learning module' : state.position>content.questions.length ? 'Module complete' : 'Activity '+state.position+' of '+content.questions.length)
      : testing ? (study.testPosition===testLength ? testLength+' questions · Review' : 'Question '+(study.testPosition+1)+' of '+testLength)
      : study.phase==='complete' ? 'All three stages complete' : 'Study overview';
    const progress = inPractice
      ? '<progress value="'+count+'" max="'+content.questions.length+'" aria-label="Activities answered">'+count+' of '+content.questions.length+'</progress>'
      : testing ? '<progress value="'+testProgress+'" max="'+testLength+'" aria-label="Position in this test">'+testProgress+' of '+testLength+'</progress>' : '';
    app.innerHTML = `<header class="topbar"><div class="brand"><strong>Programming with AI</strong></div><div class="top-meta"><span class="course">15-110</span><span aria-hidden="true">·</span><span>Pilot study</span></div></header>${studyNav()}<div class="layout ${inPractice?'module-layout':'assessment-layout'}">${inPractice?sidebar():''}<main id="main" class="main"><div class="progress-line"><span>${progressText}</span>${progress}</div><p id="storage-warning" class="storage-warning" role="status" ${storageWarning?'':'hidden'}>${esc(storageWarning)}</p>${body}</main><footer class="footer"><span>Programming with AI · Pilot study</span><span>Responses stay in this browser until downloaded.</span></footer></div>`;
    const title = inPractice && state.position > 0 && state.position <= content.questions.length ? content.questions[state.position-1].title + ' · ' : testing ? tests[study.phase].title + ' · ' : '';
    document.title = title + 'Programming with AI';
    if (focusId) document.getElementById(focusId)?.focus({ preventScroll: true });
  }
  function download(type) {
    if (study.phase !== 'complete') return;
    flush(); persist();
    const data = type === 'csv' ? studyModel.csv(study,content,tests) : JSON.stringify(studyModel.exportJson(study,content,tests), null, 2);
    const blob = new Blob([data], { type: type === 'csv' ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = 'programming-ai-' + state.sessionId.replace(/[^a-z0-9-]/gi,'') + '.' + type;
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    document.getElementById('download-status').textContent = 'Download requested. Keep the file with your pilot notes.';
  }
  app.addEventListener('change', event => {
    if (['pre','post'].includes(study.phase)) {
      if (event.target.matches('[data-test-answer]')) {
        studyModel.saveDraft(study,tests,study.phase,event.target.dataset.testAnswer,Number(event.target.value));
        app.querySelectorAll('.choice').forEach(label => label.classList.toggle('selected',label.querySelector('input').checked));
        persist();
        const error = document.getElementById('answer-error'); if (error) error.hidden = true;
      }
      return;
    }
    if (study.phase !== 'practice') return;
    if (state.position < 1 || state.position > content.questions.length) return;
    const q = content.questions[state.position-1];
    if (state.responses[q.id]) return;
    if (event.target.matches('[data-fragment]')) {
      const values = [...selectedValue(q)]; values[Number(event.target.dataset.fragment)] = Number(event.target.value); drafts[q.id] = values;
    } else if (event.target.matches('input[name=answer]')) {
      drafts[q.id] = q.type === 'multi' ? [...app.querySelectorAll('input[name=answer]:checked')].map(input => Number(input.value)) : Number(event.target.value);
      app.querySelectorAll('.choice').forEach(label => label.classList.toggle('selected',label.querySelector('input').checked));
    }
    const error = document.getElementById('answer-error'); if (error) error.hidden = true;
  });
  app.addEventListener('input', event => {
    if (!['pre','post'].includes(study.phase) || !event.target.matches('[data-test-text]')) return;
    studyModel.saveDraft(study,tests,study.phase,event.target.dataset.testText,event.target.value);
    persist();
  });
  app.addEventListener('submit', event => {
    if (event.target.id === 'test-form' && ['pre','post'].includes(study.phase)) {
      event.preventDefault();
      const q = tests[study.phase].questions[study.testPosition];
      if (q.type === 'single' && !Number.isInteger(study.tests[study.phase].drafts[q.id])) {
        const error = document.getElementById('answer-error'); error.hidden = false; error.textContent = 'Choose an answer before continuing.';
        app.querySelector('input[name=test-answer]')?.focus(); return;
      }
      changeTestPosition(study.testPosition+1); return;
    }
    if (study.phase !== 'practice') return;
    if (event.target.id !== 'answer-form') return;
    event.preventDefault();
    const q = content.questions[state.position-1];
    const value = selectedValue(q);
    if (!model.validAnswer(q, value)) {
      const error = document.getElementById('answer-error'); error.hidden = false;
      error.textContent = q.type === 'sort' ? 'Choose a category for every fragment before checking.' : q.type === 'multi' ? 'Select at least one choice before checking.' : 'Choose an answer before checking.';
      const target = q.type === 'sort' ? [...app.querySelectorAll('select')].find(el => el.value === '-1') : app.querySelector('input[name=answer]'); target?.focus();
      return;
    }
    flush();
    if (!model.submit(state,q,value)) return;
    persist(); render('feedback');
    document.getElementById('feedback')?.scrollIntoView({ behavior:'instant', block:'nearest' });
  });
  app.addEventListener('click', event => {
    const button = event.target.closest('button'); if (!button || button.disabled) return;
    if (button.dataset.testGo !== undefined) { changeTestPosition(Number(button.dataset.testGo)); return; }
    if (button.dataset.go !== undefined) { navigate(Number(button.dataset.go)); return; }
    const action = button.dataset.action;
    if (action === 'review-practice' && study.phase === 'complete') { reviewingPractice = true; navigate(content.questions.length+1); }
    if (action === 'return-results' && study.phase === 'complete') { reviewingPractice = false; render('page-title'); window.scrollTo({top:0,behavior:'instant'}); }
    if (action === 'start-study') changePhase('pre');
    if (action === 'start-post') changePhase('post');
    if (action === 'submit-test' && ['pre','post'].includes(study.phase)) {
      flush();
      if (!studyModel.submitTest(study,tests,study.phase)) return;
      persist(); render('page-title'); window.scrollTo({top:0,behavior:'instant'});
    }
    if (action === 'begin') navigate(model.reachable(state,content));
    if (action === 'csv' || action === 'json') download(action);
    if (action === 'reset') {
      if (!window.confirm('Start a new session? This clears the answers saved in this browser. Save the current session first if you want to keep it.')) return;
      study = studyModel.create(content,tests); state = study.module; drafts = {}; reviewingPractice = false; segmentStart = performance.now(); persist(); render('page-title'); window.scrollTo(0,0);
    }
  });
  document.addEventListener('visibilitychange', () => { flush(); active = !document.hidden && document.hasFocus(); persist(); });
  window.addEventListener('blur', () => { flush(); active = false; persist(); });
  window.addEventListener('focus', () => { segmentStart = performance.now(); active = !document.hidden; });
  window.addEventListener('pagehide', () => { flush(); persist(); });
  setInterval(() => { flush(); persist(); }, 15000);
  render(); persist();
})();
</script>
</body>
</html>
