/* A compact reading layout and feedback tied to the code. */
.topbar { height:72px; }
.layout { min-height:calc(100vh - 72px); }
.main { padding:26px 34px 32px; }
.progress-line { margin-bottom:22px; }
.activity-header { margin-bottom:22px; }
.activity-header h1 { font-size:clamp(1.8rem,2.6vw,2.3rem); margin-bottom:12px; }
.activity-grid { gap:24px; }
.code-card pre { padding:16px 0; font-size:.9375rem; }
.code-line { position:relative; display:inline-block; min-width:100%; padding:0 16px 0 42px; vertical-align:top; }
.code-line-number { position:absolute; left:0; width:28px; color:#a7b7c9; text-align:right; user-select:none; }
.code-line-number::before { content:attr(data-line); }
.code-line.focus-line { background:#2c3c4d; box-shadow:inset 3px 0 #a4c7e5; }
.choice.selected:not(.good):not(.missed) { border-color:#335d86; background:#eef3f9; box-shadow:inset 0 0 0 1px #335d86; }
.choice input:checked { background:#335d86; border-color:#335d86; }
.choice.good input:checked { background:var(--green); border-color:var(--green); }
.choice.missed input:checked { background:var(--amber); border-color:var(--amber); }
.review-steps { display:flex; flex-wrap:wrap; gap:12px 22px; margin:18px 0 0; padding:0; list-style:none; font-size:.875rem; color:var(--muted); }
.review-steps li { display:flex; align-items:center; gap:7px; }
.review-steps li > span { display:grid; place-items:center; width:22px; height:22px; border:1px solid currentColor; border-radius:50%; font-size:.75rem; }
.review-steps .current { color:var(--red); font-weight:700; }
.review-steps .current > span { background:var(--red); color:white; border-color:var(--red); }
.review-steps .done { color:var(--ink); }
.feedback-comparison { display:grid; grid-template-columns:1fr 1fr; gap:16px; background:#f0f4f8; border-radius:6px; padding:14px 16px; margin:16px 0; }
.feedback-comparison span { display:block; font-size:.875rem; color:var(--muted); margin-bottom:4px; }
.feedback-comparison code { font-size:1rem; white-space:pre-wrap; overflow-wrap:anywhere; }
.feedback .line-reference { padding-left:12px; border-left:3px solid #668caa; }
.closing-lessons { margin:28px 0; }
.closing .score-summary { color:var(--muted); font-size:.9375rem; margin:20px 0 0; }
.score-summary strong { color:var(--ink); }
@media(max-width:1280px) {
  .layout { display:block; }
  .sidebar { border-right:0; border-bottom:1px solid var(--line); padding:12px 28px; }
  .side-label,.side-note { display:none; }
  .stage-list { flex-direction:row; gap:6px; }
  .stage-list li { flex:1; min-width:0; }
  .stage-button { justify-content:center; gap:8px; padding:8px 6px; }
  .activity-grid { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .evidence { position:sticky; top:20px; }
}
@media(max-width:880px) {
  .activity-grid { grid-template-columns:1fr; }
  .evidence { position:static; }
  .main { padding:24px; }
}
@media(max-width:760px) {
  .sidebar { padding:10px 16px; }
  .main { padding:22px 20px 28px; }
  .activity-grid { gap:6px; }
  .review-steps { gap:10px 14px; }
}
@media(max-width:380px) {
  .feedback-comparison { grid-template-columns:1fr; gap:10px; }
}
@media(forced-colors:active) {
  .choice input,.choice input:checked,.choice.good input:checked,.choice.missed input:checked { appearance:auto; background:Canvas; border-color:ButtonText; box-shadow:none; }
  .choice.selected:not(.good):not(.missed) { outline:2px solid Highlight; box-shadow:none; }
  .code-line.focus-line { outline:2px solid Highlight; outline-offset:-2px; box-shadow:none; }
  .review-steps .current > span { background:Highlight; color:HighlightText; }
}
@media print {
  .sidebar { display:none; }
  .main { padding:0; }
  .activity-grid { display:block; }
  .evidence { position:static; }
}

  }
  function codeBlock(code, label = 'Recorded AI response', focusLines = []) {
    const lines = code.split('\n').map((line, i) => `<span class="code-line ${focusLines.includes(i+1)?'focus-line':''}"><span class="code-line-number" data-line="${i+1}" aria-hidden="true"></span>${highlight(line)}</span>`).join('\n');
    const note = focusLines.length ? `; highlighted ${focusLines.length===1?'line':'lines'} ${focusLines.join(', ')}` : '';
    return `<div class="code-card"><div class="code-label"><span>${esc(label)}</span><span class="language">Python</span></div><pre tabindex="0" aria-label="${esc(label+note)}"><code>${lines}</code></pre></div>`;
  }
  function reviewSteps(q) {
    if (q.reviewStep == null) return '';
    return `<ol class="review-steps" aria-label="Code review process">${['Trace','Diagnose','Verify','Refine'].map((label,i) => `<li class="${i===q.reviewStep?'current':i<q.reviewStep?'done':''}" ${i===q.reviewStep?'aria-current="step"':''}><span aria-hidden="true">${i+1}</span>${label}</li>`).join('')}</ol>`;
  }
  function specification(text) { return `<div class="spec"><div class="label">The prompt</div><p>${esc(text)}</p></div>`; }
  function currentSection() { return state.position === 0 ? 0 : state.position > content.questions.length ? 5 : content.questions[state.position-1].section; }
  function sectionPosition(section) { return section === 0 ? 0 : section === 5 ? content.questions.length+1 : content.questions.findIndex(q => q.section === section)+1; }
  function sectionDone(section) {
    if (section === 0) return model.reachable(state, content) > 1 || state.position > 0;
    if (section === 5) return !!state.completedAt;
    return content.questions.filter(q => q.section === section).every(q => state.responses[q.id]);
  }
  function sidebar() {
    return `<aside class="sidebar"><nav aria-label="Practice sections"><p class="side-label">Your practice</p><ol class="stage-list">${content.sections.map((name, i) => {
      const current = currentSection() === i, done = sectionDone(i), target = sectionPosition(i);
      return `<li><button class="stage-button ${current?'current':''} ${done&&!current?'done':''}" data-go="${target}" ${target > model.reachable(state,content)?'disabled':''} ${current?'aria-current="step"':''} aria-label="${esc(name)}${done?', completed':''}"><span class="stage-number">${done&&!current?icon('check'):String(i+1).padStart(2,'0')}</span><span class="stage-name">${esc(name)}</span></button></li>`;
    }).join('')}</ol></nav><div class="side-note"><strong>Make a choice. Read the feedback.</strong>Wrong answers are useful here. Take a moment to understand what the code does.</div></aside>`;
  }
  function ruleList() {
    return `<div class="rules"><div class="rule"><span class="rule-index">01</span><div><h2>Be specific.</h2><p>Make the inputs, outputs, and requirements clear.</p></div></div><div class="rule"><span class="rule-index">02</span><div><h2>Read, trace, understand.</h2><p>Check what the code does, line by line.</p></div></div><div class="rule"><span class="rule-index">03</span><div><h2>Test, verify, iterate.</h2><p>Compare its behavior with an answer you already know.</p></div></div></div>`;
  }
  function intro() {
    const started = Object.keys(state.responses).length > 0;
    return `<section class="intro"><p class="eyebrow">15-110 · Practice</p><h1 id="page-title" tabindex="-1">Programming with AI</h1><div class="intro-meta"><span>About 20–25 minutes</span><span>12 activities</span></div><p class="lead">Practice making the decisions that matter when you work with AI-written code. Read the prompt, trace the Python, and decide what needs checking.</p><div class="intro-content">${ruleList()}<div class="intro-aside"><h2>What you’ll do</h2><ul><li>Find what a vague prompt leaves open.</li><li>Build a specific prompt from pieces.</li><li>Work through two guided code reviews.</li><li>Make three review decisions on your own.</li></ul><p class="intro-note">All AI responses and test results were recorded ahead of time. You do not need an AI tool open—please don’t use one during this practice.</p></div></div><div class="intro-actions"><button class="btn primary" data-action="begin">${started?'Resume practice':'Begin practice'}${icon('arrow')}</button><small>You’ll get feedback after each answer.</small></div>${started?'<button class="new-session" data-action="reset">Start a new session</button>':''}</section>`;
  }
  function selectedValue(q) { return state.responses[q.id]?.answer ?? drafts[q.id] ?? (q.type === 'single' ? null : q.type === 'sort' ? q.fragments.map(() => -1) : []); }
  function choices(q) {
    const response = state.responses[q.id], value = selectedValue(q);
    return `<fieldset class="choices" ${response?'disabled':''}><legend class="sr-only">${esc(q.question)}</legend>${q.options.map((option,i) => {
      const selected = q.type === 'multi' ? value.includes(i) : value === i;
      const right = q.type === 'multi' ? q.answer.includes(i) : q.answer === i;
      const status = !response ? '' : right ? 'good' : selected ? 'missed' : '';
      const badge = !response ? '' : right ? (selected?'Your answer · Correct':'Correct answer') : selected ? 'Your answer · Review the explanation' : '';
      return `<label class="choice ${selected?'selected':''} ${status}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="answer" value="${i}" ${selected?'checked':''}><span class="choice-body">${q.codeOptions?`<code>${esc(option)}</code>`:esc(option)}${badge?`<span class="choice-status">${badge}</span>`:''}</span></label>`;
    }).join('')}</fieldset>`;
  }
  function sorting(q) {
    const value = selectedValue(q), response = state.responses[q.id];
    return `<div class="sort-list">${q.fragments.map((fragment,i) => {
      const right = value[i] === fragment[1];
      return `<div class="sort-row ${response?(right?'good':'missed'):''}"><label for="fragment-${i}"><span class="fragment-number">${String(i+1).padStart(2,'0')}</span>${esc(fragment[0])}</label><select id="fragment-${i}" data-fragment="${i}" ${response?'disabled':''}><option value="-1">Choose a category…</option>${q.slots.map((slot,j) => `<option value="${j}" ${value[i]===j?'selected':''}>${esc(slot)}</option>`).join('')}</select>${response?`<div class="sort-result"><strong>${right?'Correct:':'Correct category:'} ${esc(q.slots[fragment[1]])}</strong>${esc(fragment[2])}</div>`:''}</div>`;
    }).join('')}</div>`;
  }
  function testResults(fixed = false, selection = null) {
    const tests = [
      ['assert countYes(["yes", "Yes", "YES"]) == 3', fixed?'Test passes · actual 3 / expected 3':'Test fails · actual 1 / expected 3'],
      ['assert countYes(["yes", "yes"]) == 2', 'Test passes · actual 2 / expected 2'],
      ['assert countYes([]) == 0', 'Test passes · actual 0 / expected 0']
    ];
    return `<div class="recorded"><h4>${fixed?'Recheck the corrected code':'Recorded test results'}</h4><p class="caption">${fixed?'These results are from the corrected Python above.':'These results are from the original Python shown here.'} The code is not running in this page.</p>${selection===3?'<p>No execution result comes from asking the AI for assurance.</p>':''}${tests.map((test,i) => `<div class="test-row"><code>${esc(test[0])}</code><span class="test-result ${!fixed&&i===0?'fail':''}">${selection===i?'Your chosen test · ':''}${esc(test[1])}</span></div>`).join('')}</div>`;
  }
  function feedback(q) {
    const response = state.responses[q.id];
    if (!response) return '';
    let extra = '';
    if (q.type === 'single') extra = `<p class="selected-explanation">${esc(q.feedback[response.answer])}</p>`;
    if (q.type === 'sort') {
      const count = response.answer.filter((v,i) => v === q.fragments[i][1]).length;
      extra = `<p class="selected-explanation">You placed ${count} of ${q.fragments.length} fragments in the matching category. The explanation for each fragment is shown above.</p>`;
    }
    const otherFeedback = q.feedback ? `<details class="extra-feedback"><summary>${q.type==='multi'?'See the reasoning for each choice':'Why the other choices differ'}</summary><ul>${q.feedback.map((f,i) => q.type==='single'&&i===response.answer?'':`<li><strong>${esc(q.options[i])}</strong>${esc(f)}</li>`).join('')}</ul></details>` : '';
    const worked = q.worked ? `<ol class="worked-steps"><li><strong>2 · Diagnose</strong>The endpoint is excluded. That misses the classmate’s intended inclusive interval.</li><li><strong>3 · Verify</strong><code>assert multiplesOf11(1, 33) == [11, 22, 33]</code><br>This test fails: the actual result is <code>[11, 22]</code>.</li><li><strong>4 · Trace it back</strong>Specify “both endpoints inclusive.” The code change is <code>range(start, end + 1)</code>. Also check an empty interval and a start value that is itself a multiple of 11.</li></ol>` : '';
    const fixed = q.fixedCode ? codeBlock(content.codes[q.fixedCode], 'Corrected implementation', q.fixedFocusLines || []) : '';
    const comparison = q.traceResult ? `<div class="feedback-comparison"><div><span>Your prediction</span><code>${esc(q.options[response.answer])}</code></div><div><span>Actual return</span><code>${esc(q.traceResult)}</code></div></div>` : '';
    const lineNote = q.focusLine ? `<p class="line-reference"><strong>Line ${q.focusLine} in the original code:</strong> ${esc(q.lineNote)}</p>` : '';
    return `<section id="feedback" class="feedback" tabindex="-1" aria-labelledby="feedback-heading"><div class="feedback-label ${response.correct?'':'revisit'}">${icon(response.correct?'check':'review')}${response.correct?'Your answer is correct':q.type==='sort'?'Compare the categories':'Let’s look at the explanation'}</div><h3 id="feedback-heading">${esc(q.takeaway)}</h3>${comparison}${lineNote}${extra}<p>${esc(q.explanation)}</p>${worked}${q.recordedTests?testResults(false,response.answer):''}${fixed}${q.fixedTests?`<details class="extra-feedback" data-testid="fixed-tests"><summary>View the recorded test results</summary>${testResults(true)}</details>`:''}${q.assembled?`<details class="extra-feedback"><summary>Read the assembled prompt</summary><div class="assembled">${esc(q.assembled)}</div></details>`:''}${otherFeedback}</section>`;
  }
  function questionPage(q) {
    const index = state.position, answered = !!state.responses[q.id];
    const evidence = q.codeKeys?.length ? `<aside class="evidence" aria-label="Prompt and code">${q.spec?specification(q.spec):''}${q.codeKeys.map((k,i) => codeBlock(content.codes[k],q.codeLabels?.[i] || 'Recorded AI response',answered&&q.focusLine?[q.focusLine]:[])).join('')}${q.reminder?`<details class="reminder"><summary>Python reminder</summary><p>${esc(q.reminder)}</p></details>`:''}</aside>` : '';
    return `<header class="activity-header"><p class="eyebrow">${esc(q.eyebrow || content.sections[q.section])}</p><h1 id="page-title" tabindex="-1">${esc(q.title)}</h1><p class="lead">${esc(q.context)}</p>${reviewSteps(q)}</header><div class="activity-grid ${evidence?'':'single-column'}">${evidence}<section class="answer-panel" aria-labelledby="question-title"><p class="question-kind">${q.type==='sort'?'Sort the fragments':q.type==='multi'?'Select all that apply':'Choose one answer'}${q.scored?'':' · Practice, not scored'}</p>${!evidence&&q.spec?specification(q.spec):''}<h2 id="question-title" class="question-title">${esc(q.question)}</h2>${q.instruction?`<p class="instruction">${esc(q.instruction)}</p>`:''}<form id="answer-form" novalidate>${q.type==='sort'?sorting(q):choices(q)}<p id="answer-error" class="error" role="alert" hidden></p>${feedback(q)}<div class="action-row"><button class="btn quiet" type="button" data-go="${index-1}">${icon('back')}Back</button>${answered?`<button class="btn primary" type="button" data-go="${index+1}">${index===content.questions.length?'Finish practice':'Continue'}${icon('arrow')}</button>`:`<button class="btn primary" type="submit">Check ${q.type==='sort'?'categories':'answer'}${icon('arrow')}</button>`}</div></form>${answered?'<p class="question-kind" style="margin:16px 0 0">Your first answer is saved. You can revisit the explanation.</p>':''}</section></div>${state.completedAt?'<button class="btn quiet" data-go="13">Return to wrap-up →</button>':''}`;
  }
  function closing() {
    const total = content.questions.filter(q => q.scored).length;
    return `<section class="closing"><p class="eyebrow">Practice complete</p><h1 id="page-title" tabindex="-1">Keep checking.</h1><p class="lead">Code that runs is not necessarily correct. You remain responsible for checking that it meets the requirements.</p><div class="closing-lessons"><h2>The three rules</h2>${ruleList()}</div><h2>Revisit an explanation</h2><ul class="review-list">${content.questions.map((q,i) => {
      const r = state.responses[q.id];
      return `<li><button class="review-item" data-go="${i+1}"><span class="review-icon ${r.correct?'':'revisit'}">${icon(r.correct?'check':'review')}</span><span class="review-text">${esc(q.title)}<small>${q.scored?(r.correct?'Correct on first attempt':'Worth another look'):'Unscored practice'}</small></span><span class="arrow">${icon('arrow')}</span></button></li>`;
    }).join('')}</ul><p class="score-summary"><strong>${model.score(state,content)} of ${total}</strong> scored questions answered correctly on your first attempt. The two unscored activities are not included.</p><div class="session-tools"><h2>Save this session</h2><p>Download the answers and time spent for your pilot discussion. Results stay in this browser until you save or share the file.</p><div class="download-actions"><button class="btn primary" data-action="csv">${icon('download')}Save results (.csv)</button><button class="btn secondary" data-action="json">Save session (.json)</button></div><p id="download-status" role="status"></p><p>You can save these files before starting with the next participant.</p><button class="new-session" data-action="reset">Start a new session</button></div></section>`;
  }
  function render(focusId) {
    const count = Object.keys(state.responses).length;
    const body = state.position === 0 ? intro() : state.position > content.questions.length ? closing() : questionPage(content.questions[state.position-1]);
    const progressText = state.position === 0 ? 'Your practice, step by step' : state.position > content.questions.length ? 'All activities complete' : `Activity ${state.position} of ${content.questions.length}`;
    app.innerHTML = `<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><div><strong>Programming with AI</strong><small>Question-based practice</small></div></div><div class="top-meta"><span class="course">15-110</span><span class="dot"></span><span>Informal pilot</span></div></header><div class="layout">${sidebar()}<main id="main" class="main"><div class="progress-line"><progress value="${count}" max="${content.questions.length}" aria-label="Activities answered">${count} of ${content.questions.length}</progress><span>${progressText}</span></div><p id="storage-warning" class="storage-warning" role="status" ${storageWarning?'':'hidden'}>${esc(storageWarning)}</p>${body}<footer class="footer"><span>Read the code. Make your call. Use the feedback.</span><span>Programming with AI · Practice</span></footer></main></div>`;
    const title = state.position > 0 && state.position <= content.questions.length ? content.questions[state.position-1].title + ' · ' : '';
    document.title = title + 'Programming with AI';
    if (focusId) document.getElementById(focusId)?.focus({ preventScroll: true });
  }
  function download(type) {
    flush(); persist();
    const data = type === 'csv' ? model.csv(state,content) : JSON.stringify({ ...state, score: model.score(state,content), scoredQuestions: content.questions.filter(q=>q.scored).length, timingNote: 'Approximate active time; paused while the page is hidden or the window loses focus.', questions: model.rows(state,content).map(row => ({ id:row[2], section:row[3], question:row[4], scored:row[5]==='yes', firstAnswer:row[6], correct:row[7]==='yes', answeredAt:row[8], activeAnswerSeconds:Number(row[9]), activeFeedbackSeconds:Number(row[10]) })) }, null, 2);
    const blob = new Blob([data], { type: type === 'csv' ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = 'programming-ai-' + state.sessionId.replace(/[^a-z0-9-]/gi,'') + '.' + type;
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    document.getElementById('download-status').textContent = 'Download requested. Keep the file with your pilot notes.';
  }
  app.addEventListener('change', event => {
    if (state.position < 1 || state.position > content.questions.length) return;
    const q = content.questions[state.position-1];
    if (state.responses[q.id]) return;
    if (event.target.matches('[data-fragment]')) {
      const values = [...selectedValue(q)]; values[Number(event.target.dataset.fragment)] = Number(event.target.value); drafts[q.id] = values;
    } else if (event.target.matches('input[name=answer]')) {
      drafts[q.id] = q.type === 'multi' ? [...app.querySelectorAll('input[name=answer]:checked')].map(input => Number(input.value)) : Number(event.target.value);
      app.querySelectorAll('.choice').forEach(label => label.classList.toggle('selected',label.querySelector('input').checked));
    }
    const error = document.getElementById('answer-error'); if (error) error.hidden = true;
  });
  app.addEventListener('submit', event => {
    if (event.target.id !== 'answer-form') return;
    event.preventDefault();
    const q = content.questions[state.position-1];
    const value = selectedValue(q);
    if (!model.validAnswer(q, value)) {
      const error = document.getElementById('answer-error'); error.hidden = false;
      error.textContent = q.type === 'sort' ? 'Choose a category for every fragment before checking.' : q.type === 'multi' ? 'Select at least one choice before checking.' : 'Choose an answer before checking.';
      const target = q.type === 'sort' ? [...app.querySelectorAll('select')].find(el => el.value === '-1') : app.querySelector('input[name=answer]'); target?.focus();
      return;
    }
    flush();
    if (!model.submit(state,q,value)) return;
    persist(); render('feedback');
    document.getElementById('feedback')?.scrollIntoView({ behavior:'instant', block:'nearest' });
  });
  app.addEventListener('click', event => {
    const button = event.target.closest('button'); if (!button || button.disabled) return;
    if (button.dataset.go !== undefined) { navigate(Number(button.dataset.go)); return; }
    const action = button.dataset.action;
    if (action === 'begin') navigate(model.reachable(state,content));
    if (action === 'csv' || action === 'json') download(action);
    if (action === 'reset') {
      if (!window.confirm('Start a new session? This clears the answers saved in this browser. Save the current session first if you want to keep it.')) return;
      state = model.create(content); drafts = {}; segmentStart = performance.now(); persist(); render('page-title'); window.scrollTo(0,0);
    }
  });
  document.addEventListener('visibilitychange', () => { flush(); active = !document.hidden; persist(); });
  window.addEventListener('blur', () => { flush(); active = false; persist(); });
  window.addEventListener('focus', () => { segmentStart = performance.now(); active = !document.hidden; });
  window.addEventListener('pagehide', () => { flush(); persist(); });
  setInterval(() => { flush(); persist(); }, 15000);
  render(); persist();
})();
</script>
</body>
</html>
